<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <style>
        #css-editor {
            width: 100%;
            height: 300px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Admin Dashboard</h1>
    
    <h2>Edit Global CSS</h2>
    <textarea id="css-editor"></textarea>
    <button id="save-css">Save CSS</button>

    <script>
        // Load current CSS
        fetch('/static/css/global.css')
            .then(res => res.text())
            .then(css => {
                document.getElementById('css-editor').value = css;
            });

        // Save new CSS
        document.getElementById('save-css').addEventListener('click', () => {
            const css = document.getElementById('css-editor').value;
            fetch('/admin/save-css', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `css_content=${encodeURIComponent(css)}`
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) alert("CSS Updated!");
                else alert("Error: " + data.error);
            });
        });
    </script>
</body>
</html>
