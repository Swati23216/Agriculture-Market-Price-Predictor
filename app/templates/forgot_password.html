<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #5a3184);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .forgot-container {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 38px 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            width: 350px;
        }
        .forgot-container h2 {
            color: #fff;
            text-align: center;
            margin-bottom: 22px;
            letter-spacing: 1px;
        }
        .forgot-container input[type="email"] {
            width: 100%;
             padding: 12px 0px;
            
            margin-bottom: 18px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.22);
            color: #222;
            font-size: 1rem;
        }
        .forgot-container input[type="email"]::placeholder {
            color: #bbb;
        }
        .forgot-container button {
            width: 100%;
            padding: 12px;
            background: #4fd1c5;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .forgot-container button:hover {
            background: #38b2ac;
        }
    </style>
</head>
<body>
    <div class="forgot-container">
        <h2>Forgot Password</h2>
        <form method="POST">
            <input type="email" name="email" placeholder="Your email" required>
            <button type="submit">Send OTP</button>
        </form>
    </div>
</body>
</html>
