<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Agricultural Market Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b5e20;
            --primary-light: #81c784;
            --secondary: #ff8f00;
            --dark: #263238;
            --light: #f5f5f5;
            --accent: #4fc3f7;
            --text: #333333;
            --text-light: #757575;
            --white: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.12);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --radius: 8px;
            --max-width: 1200px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text);
            background-color: var(--white);
            line-height: 1.6;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            line-height: 1.2;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            width: 100%;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius);
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            border: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background-color: var(--white);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo img {
            height: 50px;
            width: auto;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            font-weight: 500;
            position: relative;
            padding: 0.5rem 0;
            color: var(--dark);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--primary);
            transition: var(--transition);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* Register Section */
        .register-section {
            padding: 8rem 0 4rem;
            background-color: var(--white);
        }

        .register-container {
            background-color: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 3rem;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        .register-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
        }

        .register-title {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary);
        }

        .register-title h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--dark);
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: var(--radius);
            font-family: inherit;
            transition: var(--transition);
            background-color: var(--light);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.2);
        }

        /* Role selection styling */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 15px;
        }

        .login-link {
            text-align: center;
            margin-top: 2rem;
            color: var(--text-light);
        }

        .login-link a {
            color: var(--primary);
            font-weight: 500;
            transition: var(--transition);
        }

        .login-link a:hover {
            color: var(--primary-dark);
        }

        /* Footer */
        footer {
            background-color: var(--dark);
            color: var(--white);
            padding: 2rem 0;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .register-container {
                padding: 2rem;
            }
            
            .nav-links {
                gap: 1rem;
            }
        }

        @media (max-width: 576px) {
            .register-section {
                padding: 6rem 0 3rem;
            }
            
            .register-container {
                padding: 1.5rem;
            }
            
            .register-title h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav class="navbar">
                <a href="/" class="logo">
                    <img src="https://cdn-icons-png.flaticon.com/512/2777/2777154.png" alt="FarmPredict Logo">
                    <span class="logo-text">Farm<span>Predict</span></span>
                </a>
                <div class="nav-links">
                    <a href="/">Home</a>
                    <a href="/register">Register</a>
                    <a href="/login">Login</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="register-section">
            <div class="container">
                <div class="register-container">
                    <div class="register-title">
                        <h2>Create Your Account</h2>
                    </div>
                    
                    <form method="POST" action="/register">
                        <div class="form-group">
                            <input type="text" name="name" id="name" class="form-control" placeholder=" " required />
                            <label for="name" class="floating-label">Full Name</label>
                        </div>

                        <div class="form-group">
                            <input type="email" name="email" id="email" class="form-control" placeholder=" " required />
                            <label for="email" class="floating-label">Email Address</label>
                        </div>

                        <div class="form-group">
                            <input type="password" name="password" id="password" class="form-control" placeholder=" " required />
                            <label for="password" class="floating-label">Password</label>
                        </div>

                        <!-- Your exact role selection code integrated -->
                        <div class="form-group">
                            <label for="role">Register As:</label>
                            <select name="role" id="role" class="form-control" required>
                                {% if roles %} {% for role in roles %}
                                <option value="{{ role.name }}">{{ role.name|capitalize }}</option>
                                {% endfor %} {% else %}
                                <option value="user">User</option>
                                <option value="admin">Admin</option>
                                {% endif %}
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%;">
                            <span>Register Now</span>
                        </button>
                    </form>
                    
                    <p class="login-link">
                        Already have an account? <a href="/login">Sign in here</a>
                    </p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 FarmPredict. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        // Form submission handling
        const form = document.querySelector('form');
        form.addEventListener('submit', function(e) {
            const btn = this.querySelector('button');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registering...';
            btn.disabled = true;
            
            // In a real application, you would handle the form submission here
            // This is just for demonstration
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-check"></i> Registration Successful';
                btn.style.backgroundColor = 'var(--primary-dark)';
            }, 1500);
        });

        // Floating label functionality
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentNode.querySelector('.floating-label').style.color = 'var(--primary)';
            });

            input.addEventListener('blur', function() {
                this.parentNode.querySelector('.floating-label').style.color = '#999';
            });

            // Initialize floating labels
            if (this.value) {
                const label = this.parentNode.querySelector('.floating-label');
                label.style.top = '-10px';
                label.style.left = '15px';
                label.style.fontSize = '12px';
                label.style.background = 'white';
                label.style.padding = '0 5px';
            }
        });
    </script>
</body>
</html>
